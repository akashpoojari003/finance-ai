spring:
  application:
    name: ai-finance

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
        format_sql: true

  jackson:
    time-zone: Asia/Kolkata
#    serialization:
#      write-dates-as-timestamps: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}

  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}

  gemini-key: ${GEMINI_API_KEY:}
  gemini:
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    url: https://generativelanguage.googleapis.com/v1beta/models

  cron-token: ${CRON_TOKEN:}
  alerts:
    scheduler-enabled: ${ALERTS_SCHEDULER_ENABLED:true}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
  twilio:
    sid: ${TWILIO_SID:}
    token: ${TWILIO_TOKEN:}
    from: ${TWILIO_FROM:}

  prometheus-token: ${PROMETHEUS_TOKEN:}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      slo:
        http.server.requests: 100ms,300ms,500ms,1s
