[SERVICE]
    Flush       1
    Daemon      Off
    Log_Level   info

[INPUT]
    Name        tcp
    Listen      0.0.0.0
    Port        5170
    Format      json
    Tag         financeai-api

[OUTPUT]
    Name        loki
    Match       *
    Host        loki
    Port        3100
    Labels      app=ai-finance-manager, env=dev
    Label_Keys  $level
    Line_Format json
    Retry_Limit 10