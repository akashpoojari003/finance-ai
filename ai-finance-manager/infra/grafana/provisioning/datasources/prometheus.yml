apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    static_configs:
      - targets: [ "host.docker.internal:8081" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ai_finance_manager-api
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /tmp/scrape_token
    static_configs:
      - targets: ["host.docker.internal:8081"]